<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>First Day with AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout concept: a city-hall screening room. Each chapter is a reel on a dark stage;
   source documents appear as lit paper under a sodium streetlight; prompts are typed on mono. */
:root {
  --night: #0d1625;        /* stage */
  --night-2: #142035;      /* raised panel */
  --night-3: #1c2b45;      /* inset / hover */
  --line: #2b3d5c;         /* hairlines */
  --text: #e6ecf3;         /* primary text */
  --muted: #9cadc4;        /* secondary text */
  --sodium: #f2a33a;       /* streetlight amber: the one accent */
  --sodium-ink: #1a1206;   /* text on amber */
  --sodium-soft: rgba(242,163,58,.13);
  --paper: #edf0f4;        /* source documents */
  --paper-ink: #19222f;
  --paper-mute: #5a6678;
  --go: #46bf86;           /* semantic: pass / green light */
  --caution: #e9c33d;      /* semantic: yellow light */
  --stop: #ee5b50;         /* semantic: fail / red light */
  --f-display: "Overpass", "Helvetica Neue", Arial, sans-serif;   /* highway-sign lineage */
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --step--1: .84rem; --step-0: 1.0625rem; --step-1: 1.3rem; --step-2: 1.7rem; --step-3: 2.3rem; --step-4: clamp(2.6rem, 7vw, 5rem);
  --radius: 6px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--night); color: var(--text);
  font-family: var(--f-body); font-size: var(--step-0); line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--night); }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.measure { max-width: 68ch; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h2 { font-size: var(--step-3); font-weight: 900; }
h3 { font-size: var(--step-2); font-weight: 800; }
h4 { font-size: var(--step-1); font-weight: 800; }
p { margin: 0; }
a { color: var(--sodium); text-underline-offset: 3px; }
a:hover { color: var(--text); }
.eyebrow { font-family: var(--f-display); font-weight: 800; font-size: var(--step--1); letter-spacing: .14em; text-transform: uppercase; color: var(--sodium); }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.stack-lg { display: flex; flex-direction: column; gap: 2rem; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
:focus-visible { outline: 3px solid var(--sodium); outline-offset: 2px; border-radius: 3px; }

/* grain */
#grain { position: fixed; inset: 0; pointer-events: none; z-index: 80; opacity: .07; mix-blend-mode: screen; }
@media (prefers-reduced-motion: no-preference) { #grain.live { animation: grain 1s steps(6) infinite; } }
@keyframes grain { 0%{background-position:0 0} 20%{background-position:-40px 30px} 40%{background-position:30px -50px} 60%{background-position:-20px -10px} 80%{background-position:50px 20px} 100%{background-position:0 0} }

/* buttons */
.btn { font-family: var(--f-display); font-weight: 800; font-size: .95rem; letter-spacing: .02em; border: 1px solid var(--line); background: var(--night-2); color: var(--text); padding: .55rem 1rem; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; gap: .45rem; text-decoration: none; }
.btn:hover { background: var(--night-3); color: var(--text); }
.btn.primary { background: var(--sodium); color: var(--sodium-ink); border-color: var(--sodium); }
.btn.primary:hover { filter: brightness(1.08); color: var(--sodium-ink); }
.btn.ghost { background: transparent; }
.btn.small { font-size: .82rem; padding: .35rem .7rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { font-family: var(--f-display); font-weight: 800; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; padding: .2rem .55rem; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.done { color: var(--go); border-color: color-mix(in srgb, var(--go) 50%, transparent); }
.chip.now { color: var(--sodium); border-color: color-mix(in srgb, var(--sodium) 55%, transparent); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--night) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 1rem; min-height: 56px; }
.brand { font-family: var(--f-display); font-weight: 900; font-size: 1rem; letter-spacing: .02em; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: .6rem; white-space: nowrap; }
.brand .sign { background: var(--go); color: #062314; font-size: .7rem; padding: .15rem .4rem; border-radius: 3px; letter-spacing: .08em; }
.reelbar { display: flex; gap: 4px; flex: 1; min-width: 0; }
.reelbar a { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.reelbar a.done { background: var(--go); }
.reelbar a.cur { background: var(--sodium); }
.topbar .count { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { .topbar .count { display: none; } .brand .long { display: none; } }

/* hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line);
  background:
    radial-gradient(60% 70% at 88% 0%, rgba(242,163,58,.22), transparent 60%),
    radial-gradient(40% 50% at 10% 100%, rgba(70,110,170,.18), transparent 70%),
    var(--night); }
.hero .wrap { padding-block: clamp(2.5rem, 6vw, 4.5rem); display: grid; gap: 2rem; }
.bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: 14px; background: #04070c; z-index: 2; transform-origin: top; }
.bars::before { top: 0; } .bars::after { bottom: 0; transform-origin: bottom; }
@media (prefers-reduced-motion: no-preference) {
  .bars::before, .bars::after { animation: bars 1.4s cubic-bezier(.7,0,.2,1) both; }
  .hero .reveal { animation: rise .9s .5s cubic-bezier(.2,.7,.2,1) both; }
}
@keyframes bars { from { height: 50%; } to { height: 14px; } }
@keyframes rise { from { opacity: .15; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.slate { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.hero h1 { font-size: var(--step-4); font-weight: 900; letter-spacing: -.03em; line-height: .95; }
.hero h1 em { font-style: normal; color: var(--sodium); }
.hero .lede { font-size: var(--step-1); max-width: 40ch; color: var(--text); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.take { background: var(--night-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
.take .label { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.take.bad .label .eyebrow { color: var(--stop); }
.take.good .label .eyebrow { color: var(--go); }
.promptbox { font-family: var(--f-mono); font-size: .82rem; line-height: 1.55; background: #0a111d; border: 1px solid var(--line); border-left: 4px solid var(--sodium); padding: .7rem .8rem; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; color: #dbe4ef; }
.take.bad .promptbox { border-left-color: var(--stop); }
.output { font-family: var(--f-body); background: var(--paper); color: var(--paper-ink); border-radius: 4px; padding: .8rem .9rem; font-size: .95rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.output mark { background: rgba(238,91,80,.28); color: inherit; border-bottom: 2px solid var(--stop); padding: 0 .1em; }
.note { font-size: var(--step--1); color: var(--muted); }

/* reels (chapter map) */
.section { padding-block: clamp(2.5rem, 5vw, 4rem); }
.reels { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.reel { display: grid; grid-template-columns: 4.2rem minmax(0,1fr) auto; gap: 1rem; align-items: center; padding: 1rem .25rem; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
.reel:hover { background: var(--night-2); }
.reel .num { font-family: var(--f-display); font-weight: 900; font-size: 2rem; color: var(--muted); line-height: 1; }
.reel:hover .num { color: var(--sodium); }
.reel .t { font-family: var(--f-display); font-weight: 800; font-size: var(--step-1); line-height: 1.2; }
.reel .d { color: var(--muted); font-size: .95rem; }
.reel .meta { display: flex; flex-direction: column; align-items: flex-end; gap: .35rem; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.reel.pause { grid-template-columns: 4.2rem minmax(0,1fr) auto; color: var(--muted); padding-block: .6rem; }
.reel.pause .t { font-size: 1rem; font-weight: 600; color: var(--muted); }
.reel.pause .num { font-size: 1rem; }
@media (max-width: 560px) { .reel { grid-template-columns: 2.6rem minmax(0,1fr); } .reel .meta { grid-column: 2; flex-direction: row; align-items: center; } .reel .num { font-size: 1.4rem; } }
.how { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1.5rem; }
@media (max-width: 820px) { .how { grid-template-columns: 1fr; } }
.how h4 { margin-bottom: .4rem; }

/* chapter header */
.chhead { border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--night-2), var(--night)); }
.chhead .wrap { padding-block: 2rem 2.2rem; display: grid; gap: 1rem; }
.clapper { display: grid; grid-template-columns: repeat(4, minmax(0, auto)); justify-content: start; border: 2px solid var(--text); border-radius: 4px; overflow: hidden; max-width: 100%; }
.clapper .stripes { grid-column: 1 / -1; height: 16px; background: repeating-linear-gradient(115deg, var(--text) 0 18px, var(--night) 18px 36px); }
.clapper > div:not(.stripes) { padding: .35rem .8rem; font-family: var(--f-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; border-right: 1px solid var(--line); min-width: 0; }
.clapper > div:last-child { border-right: 0; }
.clapper b { display: block; font-family: var(--f-display); font-size: 1rem; letter-spacing: .02em; color: var(--sodium); }
@media (max-width: 560px) { .clapper { grid-template-columns: repeat(2, minmax(0,1fr)); } .clapper > div:nth-child(3) { border-right: 0; } }
.chhead h2 { font-size: clamp(2.1rem, 5vw, 3.6rem); }
.objective { border-left: 3px solid var(--sodium); padding-left: 1rem; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .chhead .wrap > * { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; } .chhead .wrap > *:nth-child(2) { animation-delay: .08s } .chhead .wrap > *:nth-child(3) { animation-delay: .16s } }

/* beats */
.beats { display: flex; flex-direction: column; gap: 3.25rem; padding-block: 2.5rem 4rem; }
.beat { display: grid; grid-template-columns: 3.2rem minmax(0,1fr); gap: 1rem; }
.beat > .bn { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); padding-top: .4rem; border-top: 2px solid var(--line); }
.beat > .bc { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
@media (max-width: 640px) { .beat { grid-template-columns: 1fr; } .beat > .bn { border-top: 0; padding: 0; } }
.beat h3 { font-size: var(--step-2); }
.prose { display: flex; flex-direction: column; gap: .8rem; max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: .4rem; }
.prose strong { color: #fff; }
.callout { background: var(--sodium-soft); border: 1px solid color-mix(in srgb, var(--sodium) 40%, transparent); border-radius: var(--radius); padding: .9rem 1rem; max-width: 72ch; }
.callout.warn { background: rgba(238,91,80,.1); border-color: rgba(238,91,80,.45); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; vertical-align: top; padding: .6rem .75rem; border-bottom: 1px solid var(--line); }
th { font-family: var(--f-display); font-weight: 800; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--night-2); }
tr:last-child td { border-bottom: 0; }
td strong { color: #fff; }

/* paper documents */
details.doc { background: var(--paper); color: var(--paper-ink); border-radius: var(--radius); max-width: 78ch; }
details.doc > summary { cursor: pointer; padding: .7rem 1rem; font-family: var(--f-display); font-weight: 800; font-size: .9rem; display: flex; gap: .6rem; align-items: baseline; list-style: none; }
details.doc > summary::-webkit-details-marker { display: none; }
details.doc > summary::before { content: "▸"; color: var(--paper-mute); }
details.doc[open] > summary::before { content: "▾"; }
details.doc > summary small { font-family: var(--f-mono); font-weight: 400; color: var(--paper-mute); }
details.doc .body { padding: 0 1rem 1rem; white-space: pre-wrap; font-size: .92rem; line-height: 1.55; border-top: 1px dashed #c3cad5; padding-top: .8rem; overflow-wrap: anywhere; }
details.doc .actions { padding: 0 1rem 1rem; }
details.doc .btn { background: #fff; color: var(--paper-ink); border-color: #c3cad5; }

/* quiz */
.q { background: var(--night-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: .7rem; max-width: 78ch; }
.q .opts { display: flex; flex-direction: column; gap: .45rem; }
.opt { text-align: left; font-family: var(--f-body); font-size: 1rem; background: var(--night); border: 1px solid var(--line); color: var(--text); padding: .55rem .8rem; border-radius: 4px; cursor: pointer; display: flex; gap: .7rem; }
.opt .k { font-family: var(--f-mono); color: var(--muted); }
.opt:hover { border-color: var(--muted); }
.opt.sel { border-color: var(--sodium); background: var(--sodium-soft); }
.opt.right { border-color: var(--go); background: rgba(70,191,134,.12); }
.opt.wrong { border-color: var(--stop); background: rgba(238,91,80,.1); }
.fb { font-size: .95rem; border-left: 3px solid var(--line); padding-left: .8rem; }
.fb.ok { border-color: var(--go); } .fb.no { border-color: var(--stop); }

/* runner */
.runner { display: flex; flex-direction: column; gap: .8rem; }
.runner .sides { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0,1fr)); gap: 1rem; }
@media (max-width: 860px) { .runner .sides { grid-template-columns: 1fr; } }
.side { background: var(--night-2); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem; display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
.side .head { display: flex; justify-content: space-between; gap: .5rem; align-items: center; flex-wrap: wrap; }
.side.plain .eyebrow { color: var(--muted); }
textarea, input[type=text], input[type=number], select { font-family: var(--f-mono); font-size: .84rem; line-height: 1.5; width: 100%; background: #0a111d; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: .6rem .7rem; }
textarea { resize: vertical; }
textarea.prompt-edit { border-left: 4px solid var(--sodium); min-height: 7.5rem; max-height: 22rem; }
.side.plain textarea.prompt-edit { border-left-color: var(--muted); }
input[type=text].field, textarea.field { font-family: var(--f-body); font-size: .98rem; }
label.lab { font-family: var(--f-display); font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: .3rem; }
.convo { display: flex; flex-direction: column; gap: .6rem; }
.bubble { border-radius: 4px; padding: .7rem .8rem; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .93rem; line-height: 1.5; }
.bubble.ai { background: var(--paper); color: var(--paper-ink); }
.bubble.me { background: #0a111d; border: 1px dashed var(--line); font-family: var(--f-mono); font-size: .8rem; color: #cfd8e3; }
.bubble.thinking { color: var(--paper-mute); font-style: italic; }
.bubble.err { background: rgba(238,91,80,.12); color: var(--text); border: 1px solid rgba(238,91,80,.4); font-family: var(--f-body); }
.follow { display: flex; gap: .5rem; align-items: stretch; flex-wrap: wrap; }
.follow input { flex: 1 1 14rem; }
.liveline { font-size: var(--step--1); color: var(--muted); display: flex; gap: .5rem; align-items: center; }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--go); box-shadow: 0 0 0 3px rgba(70,191,134,.2); }
.dot.off { background: var(--stop); }

/* checks */
.checks { display: flex; flex-direction: column; gap: .4rem; max-width: 78ch; }
.checks label { display: flex; gap: .6rem; align-items: flex-start; cursor: pointer; }
.checks input { margin-top: .35rem; accent-color: var(--sodium); width: 1rem; height: 1rem; flex: none; }
details.reveal { border: 1px solid var(--line); border-radius: var(--radius); background: var(--night-2); max-width: 78ch; }
details.reveal > summary { cursor: pointer; padding: .6rem .9rem; font-family: var(--f-display); font-weight: 800; font-size: .9rem; color: var(--sodium); }
details.reveal > div { padding: 0 .9rem .9rem; display: flex; flex-direction: column; gap: .6rem; }

/* tabs (stations) */
.tabs { display: flex; flex-wrap: wrap; gap: .4rem; }
.tab { font-family: var(--f-display); font-weight: 800; background: var(--night-2); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: .5rem .8rem; cursor: pointer; display: flex; gap: .5rem; align-items: center; }
.tab b { font-size: 1.15rem; color: var(--text); }
.tab[aria-selected="true"] { border-color: var(--sodium); color: var(--text); background: var(--sodium-soft); }
.tab .tick { color: var(--go); }

/* memo hunt */
.memo { background: var(--paper); color: var(--paper-ink); border-radius: var(--radius); padding: 1.1rem 1.2rem; max-width: 78ch; display: flex; flex-direction: column; gap: .5rem; }
.memo .mh { font-family: var(--f-mono); font-size: .78rem; color: var(--paper-mute); text-transform: uppercase; letter-spacing: .06em; }
.claim { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .6rem; align-items: start; padding: .45rem .55rem; border-radius: 4px; border: 1px solid transparent; }
.claim button.txt { all: unset; cursor: pointer; line-height: 1.5; }
.claim button.txt:focus-visible { outline: 3px solid var(--sodium); }
.claim.flag { background: #fde7c6; border-color: #e7b56d; }
.claim select { font-family: var(--f-display); font-size: .78rem; width: auto; background: #fff; color: var(--paper-ink); border: 1px solid #c3cad5; padding: .2rem .4rem; }
.claim .verdict { grid-column: 1 / -1; font-size: .85rem; color: var(--paper-mute); }
.claim.hit { border-color: #2f9e6b; background: #dff3e8; }
.claim.miss { border-color: #d0453b; background: #fbe2df; }
.claim.false { border-color: #d0453b; background: #fbe2df; }
.score { font-family: var(--f-display); font-weight: 900; font-size: 2rem; color: var(--sodium); }

/* traffic cards */
.sort { display: flex; flex-direction: column; gap: .5rem; max-width: 86ch; }
.srow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .8rem; align-items: center; background: var(--night-2); border: 1px solid var(--line); border-radius: 4px; padding: .6rem .8rem; }
.srow .lights { display: flex; gap: .3rem; }
.light { font-family: var(--f-display); font-weight: 800; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; padding: .35rem .55rem; border-radius: 99px; border: 1px solid var(--line); background: var(--night); color: var(--muted); cursor: pointer; }
.light.g[aria-pressed="true"] { background: var(--go); color: #062314; border-color: var(--go); }
.light.y[aria-pressed="true"] { background: var(--caution); color: #2a2200; border-color: var(--caution); }
.light.r[aria-pressed="true"] { background: var(--stop); color: #2b0603; border-color: var(--stop); }
.srow .why { grid-column: 1 / -1; font-size: .9rem; }
@media (max-width: 600px) { .srow { grid-template-columns: 1fr; } }

/* slots builder */
.stepper { display: flex; flex-wrap: wrap; gap: .4rem; }
.stepper button { font-family: var(--f-display); font-weight: 800; font-size: .85rem; border: 1px solid var(--line); background: var(--night-2); color: var(--muted); border-radius: 99px; padding: .4rem .8rem; cursor: pointer; }
.stepper button[aria-pressed="true"] { background: var(--sodium); color: var(--sodium-ink); border-color: var(--sodium); }

Fictional, for training use. Effective July 1, 2025. Owner: Human Resources Department.

1. Purpose. This policy sets the conditions under which City employees may perform some of their work from an approved location other than their City worksite.

2. Eligibility. An employee may request telework if all of the following are true: (a) the employee has completed six (6) months of continuous City service; (b) the employee's most recent performance evaluation is rated "Meets Expectations" or higher; and (c) the employee's position has been designated telework-eligible by the department director. Positions that require in-person contact with the public, operation of City vehicles or equipment, or on-site supervision of field staff are not telework-eligible.

3. Schedule. Regular telework is limited to a maximum of two (2) days per work week. Teleworking employees must be available by phone and email during core hours, 9:00 a.m. to 3:00 p.m. Every telework arrangement requires a written Telework Agreement signed by the employee and supervisor. Agreements expire each December 31 and must be renewed in January.

4. Equipment and data. The City provides a City-issued laptop. The employee is responsible for a reliable internet connection at the telework location. The City does not reimburse home internet, phone, or utility costs. City data may be stored only on City-issued devices or City-approved cloud storage.

5. Location. Telework must be performed within the state. Telework from outside the state requires advance written approval from the Human Resources Director and is limited to ten (10) working days per calendar year.

6. Ending an arrangement. Either the employee or the supervisor may end a Telework Agreement with ten (10) working days' written notice. The City may end an arrangement immediately for performance concerns or operational need.

    { h: "Would your chats survive this?", render: () => [caseFile("Case file 5 · Washington State · August 2025", "City staff's ChatGPT logs, released as public records", "Public-records requests produced thousands of pages of ChatGPT conversations from Bellingham and Everett. In Everett, ChatGPT summarized 29 public comments as revealing \"significant concerns\" about growth; a staffer read them and found an overall tone \"supportive of more housing and higher density.\" Other logs showed invented data and references to a state law that doesn't exist. In Bellingham, about half the sentences of a mayoral grant letter matched ChatGPT output, with no disclosure.", "your chats may be released, your summaries may be wrong in ways that matter, and disclosure rules apply.", "https://www.cascadepbs.org/news/2025/08/wa-city-officials-are-using-chatgpt-to-write-government-documents/", "Cascade PBS")] },
